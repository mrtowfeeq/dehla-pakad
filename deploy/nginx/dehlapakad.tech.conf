# /etc/nginx/sites-available/dehlapakad.tech  (symlink into sites-enabled)
# Serves the React build and proxies /api (REST, WebSocket /api/ws and the Clerk relay /api/__clerk) to
# the single Uvicorn process on loopback. Certificates come from certbot (see deploy/README.md).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name dehlapakad.tech www.dehlapakad.tech;
    # certbot answers its challenge here, everything else goes to HTTPS
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://dehlapakad.tech$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dehlapakad.tech;
    ssl_certificate     /etc/letsencrypt/live/dehlapakad.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dehlapakad.tech/privkey.pem;
    return 301 https://dehlapakad.tech$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dehlapakad.tech;

    ssl_certificate     /etc/letsencrypt/live/dehlapakad.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dehlapakad.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Microphone is needed for voice chat on this site only.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    client_max_body_size 1m;

    # React build (the "current" release symlink)
    root /opt/dehla-pakad/current/frontend/build;
    index index.html;

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri /index.html;
    }

    # Backend: REST + WebSocket + Clerk relay. The app trusts X-Forwarded-For only from
    # TRUSTED_PROXY_CIDRS (127.0.0.1/32 here), so overwrite it rather than append.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Keep game and voice WebSockets open between messages (the client pings regularly).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
