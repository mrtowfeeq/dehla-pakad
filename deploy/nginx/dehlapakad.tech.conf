# STEP 2 of 2 — /etc/nginx/sites-available/dehlapakad.tech  (after the certificate exists)
# Serves the React build and proxies /api (REST, WebSocket /api/ws and the Clerk relay /api/__clerk) to
# the single Uvicorn process on loopback. The certificate comes from certbot in webroot mode (see
# deploy/README.md); this file does not depend on certbot's Nginx-plugin files.
#
# Shared-server safety: the map variable has a site-specific name so it cannot clash with another
# site's `$connection_upgrade`, and no location uses add_header (an add_header inside a location would
# stop the server-level security headers from applying there).

map $http_upgrade $dehla_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;        # remove if the VPS has no IPv6
    server_name dehlapakad.tech www.dehlapakad.tech;
    # certbot renewals (webroot) keep working on port 80; everything else goes to HTTPS
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://dehlapakad.tech$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;   # remove if the VPS has no IPv6
    server_name www.dehlapakad.tech;
    ssl_certificate     /etc/letsencrypt/live/dehlapakad.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dehlapakad.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://dehlapakad.tech$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;   # remove if the VPS has no IPv6
    server_name dehlapakad.tech;

    ssl_certificate     /etc/letsencrypt/live/dehlapakad.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dehlapakad.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:dehla_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers for every response of this site (no location below overrides add_header).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Microphone is needed for voice chat on this site only.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    # Report-only first: logs violations in the browser console without blocking anything. Switch to
    # Content-Security-Policy after a clean test run (Clerk, Google Fonts, the WebSocket and sounds).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://*.clerk.accounts.dev https://*.clerk.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://img.clerk.com; media-src 'self' blob: data:; connect-src 'self' wss://dehlapakad.tech https://*.clerk.accounts.dev https://*.clerk.com https://clerk-telemetry.com; frame-src https://*.clerk.accounts.dev https://*.clerk.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Compress text assets (Ubuntu's nginx.conf enables gzip but only for HTML).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    client_max_body_size 1m;

    # React build (the "current" release symlink)
    root /opt/dehla-pakad/current/frontend/build;
    index index.html;

    # Hashed build files never change: cache for a year (`expires` sets Cache-Control without add_header).
    location /static/ {
        expires 1y;
        try_files $uri =404;
    }
    # The app shell must always be revalidated so a new release is picked up.
    location = /index.html {
        expires -1;
    }
    location / {
        try_files $uri /index.html;
    }

    # Server-internal status for deploy.sh (the backend also refuses anything that came through Nginx).
    location /api/internal/ {
        return 404;
    }

    # Backend: REST + WebSocket + Clerk relay. The app trusts X-Forwarded-For only from
    # TRUSTED_PROXY_CIDRS (127.0.0.1/32 here), so overwrite it rather than append.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dehla_connection_upgrade;
        # Keep game and voice WebSockets open between messages (the client pings regularly).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
