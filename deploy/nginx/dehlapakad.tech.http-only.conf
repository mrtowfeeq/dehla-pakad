# STEP 1 of 2 — /etc/nginx/sites-available/dehlapakad.tech  (only until the first certificate exists)
# Port 80 only, no certificate files referenced, so `nginx -t` passes on a server without a certificate.
# Used to answer certbot's HTTP-01 challenge (webroot), then replaced by dehlapakad.tech.conf.
server {
    listen 80;
    listen [::]:80;        # remove if the VPS has no IPv6
    server_name dehlapakad.tech www.dehlapakad.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 503;
    }
}
